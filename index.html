<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Token Time</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#7a4dff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Token Time">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one big coin jar on top, a week strip, then picture cards grouped by time of day, then a small shop. */
:root{
  --bg:#eef3ff;
  --ink:#1b2142;
  --muted:#5b6385;
  --card:#ffffff;
  --line:#dbe3fb;
  --coin:#ffc21a;
  --coin-deep:#e39600;
  --done:#1fae66;
  --done-soft:#dcf6e8;
  --accent:#7a4dff;
  --accent-soft:#ece5ff;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
body[data-kid="brooks"]{--accent:#0a8fe0;--accent-soft:#dff1ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:17px;line-height:1.3;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 120px calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
/* solid strip behind the iPhone clock and battery so cards don't scroll under them */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:20}

/* kid switch */
/* stays pinned at the top while scrolling, so it's always clear whose list this is */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;top:env(safe-area-inset-top);z-index:15;background:var(--bg);margin:-8px -16px 0;padding:8px 16px;box-shadow:0 6px 8px -8px rgba(27,33,66,.35)}
.kid{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:18px;background:var(--card);border:3px solid var(--line);font-family:var(--display);font-weight:600;font-size:20px}
.kid .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px}
.kid[data-k="matilda"] .av{background:#7a4dff}
.kid[data-k="brooks"] .av{background:#0a8fe0}
.kid[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* jar */
.jar{background:var(--accent);color:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.jar-top{display:flex;align-items:center;gap:16px}
.bigcoin{flex:none;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,var(--coin) 55%,var(--coin-deep));border:5px solid #fff3c4;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:40px;color:#7a4a00;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.jar h1{margin:0;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1}
.jar p{margin:4px 0 0;font-size:16px;opacity:.92}
.stack{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.mini{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,var(--coin) 60%,var(--coin-deep));border:2px solid #fff3c4}
.goal{display:flex;flex-direction:column;gap:6px;font-size:15px}
.bar{height:14px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coin);border-radius:9px;transition:width .3s}

/* days */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:16px;background:var(--card);border:3px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px;position:relative}
.day small{font-family:var(--body);font-weight:800;font-size:13px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.day[aria-pressed="true"] small{color:#fff}
.day.today::after{content:"";position:absolute;top:-6px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--coin);border:3px solid #fff}

/* groups + cards */
h2{margin:6px 2px 0;font-family:var(--display);font-weight:600;font-size:22px}
.group{display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-height:60px;padding:8px 12px;border-radius:18px;background:var(--card);border:3px solid var(--line);text-align:left;width:100%;position:relative}
.card .pic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:24px}
.card .txt{flex:1 1 0;min-width:0;font-size:16.5px;line-height:1.2}
.card .txt small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.badge{flex:none;min-width:40px;text-align:center;padding:4px 8px;border-radius:12px;background:var(--coin);color:#6a4200;font-family:var(--display);font-weight:700;font-size:15px}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:19px;color:#fff;font-weight:800}
.card.done{border-color:var(--done);background:var(--done-soft)}
.card.done .tick{background:var(--done);border-color:var(--done)}
.card.done .pic{background:#fff}
.counter{cursor:default}
/* counters: text keeps a readable width; the stepper drops to its own line when there is no room */
.card.counter .txt{flex:1 1 150px}
.step{display:flex;align-items:center;gap:8px;margin-left:auto}
.step button{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.step button:disabled{opacity:.3;cursor:default}
.step output{min-width:24px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px}

/* list / 2-per-row switch */
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:-6px}
.viewbar span{font-size:15px;color:var(--muted)}
.seg{display:flex;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{padding:6px 12px;border-radius:10px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* 2 per row: small tiles, picture + points on top, words below, stepper at the bottom */
body.tiles .group{display:grid;grid-template-columns:1fr 1fr;gap:8px}
body.tiles .group>h2,body.tiles .group>.shop,body.tiles .card.wide{grid-column:1/-1}
body.tiles .shop{grid-template-columns:1fr 1fr}
body.tiles .card:not(.wide){display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"pic badge tick" "txt txt txt" "step step step";align-items:start;align-content:start;gap:6px;padding:8px 10px;min-height:0}
body.tiles .card:not(.wide) .pic{grid-area:pic;width:36px;height:36px;font-size:21px;border-radius:10px}
body.tiles .card:not(.wide) .badge{grid-area:badge;justify-self:end;align-self:center;min-width:34px;font-size:14px;padding:3px 7px}
body.tiles .card:not(.wide) .tick{grid-area:tick;align-self:center;width:30px;height:30px;font-size:17px}
body.tiles .card:not(.wide) .txt{grid-area:txt;font-size:15px}
body.tiles .card:not(.wide) .txt small{display:none}
body.tiles .card:not(.wide) .step{grid-area:step;justify-self:center;margin:0}
body.tiles .card:not(.wide) .step button{width:34px;height:34px;font-size:20px}

/* shop */
.shop{display:grid;gap:10px}
.card.locked{opacity:.55}
.buy{display:flex;align-items:center;gap:8px}

/* feedback */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:18px;font-size:17px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pop{position:fixed;z-index:10;pointer-events:none;font-family:var(--display);font-weight:700;font-size:30px;color:var(--coin-deep);text-shadow:0 2px 0 #fff;animation:rise .8s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-70px) scale(1.3)}}
.sync{align-self:center;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:6px 12px;border-radius:14px}
.sync::before{content:"";width:10px;height:10px;border-radius:50%;background:#b8bfd8}
.sync.on::before{background:var(--done)}
.sync.off::before,.sync.wait::before{background:var(--coin)}
/* TV scoreboard: both kids side by side, sized to the screen, read-only. Meant for AirPlay from the iPad. */
.tvbtn{padding:8px 12px;border-radius:14px;background:var(--card);border:3px solid var(--line);font-size:15px;color:var(--ink)}
.tv{display:none}
body.tvmode .wrap{display:none}
body.tvmode .tv{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:calc(2vmin + env(safe-area-inset-top)) 3vmin 2.5vmin;gap:2vmin}
.tv-head{display:flex;align-items:center;gap:2vmin;font-family:var(--display);font-weight:600;font-size:4.2vmin}
.tv-head .tv-day{flex:1}
.tv-head .sync{font-size:2.4vmin;padding:0}
.tv-exit{width:6vmin;height:6vmin;border-radius:50%;background:var(--card);border:.4vmin solid var(--line);font-size:3vmin;color:var(--muted)}
.tv-kids{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3vmin}
.tv-kid{--kc:#7a4dff;--ks:#ece5ff;background:var(--card);border:.7vmin solid var(--kc);border-radius:4vmin;padding:2.6vmin 3vmin;display:flex;flex-direction:column;gap:2vmin;min-width:0}
.tv-kid.brooks{--kc:#0a8fe0;--ks:#dff1ff}
.tv-name{display:flex;align-items:center;gap:2vmin;font-family:var(--display);font-weight:600;font-size:6.5vmin;line-height:1}
.tv-av{width:9vmin;height:9vmin;border-radius:50%;background:var(--kc);color:#fff;display:grid;place-items:center;font-size:5.5vmin}
.tv-coinrow{display:flex;align-items:center;gap:3vmin}
.tv-coin{flex:none;width:19vmin;height:19vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,var(--coin) 55%,var(--coin-deep));border:1vmin solid #fff3c4;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11vmin;color:#7a4a00;box-shadow:0 .8vmin 0 rgba(0,0,0,.15)}
.tv-coin.bump{animation:bump .9s ease-out}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(.96) rotate(3deg)}100%{transform:scale(1)}}
.tv-left{font-family:var(--display);font-weight:600;font-size:5vmin;line-height:1.05}
.tv-left small{display:block;font-family:var(--body);font-weight:700;font-size:2.8vmin;color:var(--muted);margin-top:1vmin}
.tv-goal{display:flex;flex-direction:column;gap:1vmin;font-size:3vmin}
.tv-bar{height:2.4vmin;border-radius:2vmin;background:var(--ks);overflow:hidden}
.tv-bar i{display:block;height:100%;border-radius:2vmin;background:var(--coin)}
.tv-goal.ready span{color:var(--done)}
.tv-goal.ready .tv-bar i{background:var(--done)}
.tv-sub{font-family:var(--display);font-weight:600;font-size:3.4vmin;margin-top:.5vmin}
.tv-chips{display:grid;grid-template-columns:repeat(9,1fr);gap:1.1vmin}
.chip{position:relative;aspect-ratio:1;max-height:9vmin;border-radius:2vmin;background:#eef1f8;display:grid;place-items:center;font-size:4.6vmin;opacity:.4;filter:grayscale(1)}
.chip.on{opacity:1;filter:none;background:var(--done-soft);box-shadow:inset 0 0 0 .5vmin var(--done)}
.chip b{position:absolute;right:-.8vmin;bottom:-.8vmin;font-size:2.2vmin;line-height:1;background:var(--done);color:#fff;border-radius:2vmin;padding:.4vmin .8vmin}
@media (orientation:portrait){.tv-kids{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tv-coin.bump{animation:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}.bar i,.toast{transition:none}}
@media (max-width:420px){.card .txt{font-size:16.5px}.day{font-size:14px}.jar h1{font-size:24px}}
</style>
</head>
<body data-kid="matilda">
<div class="wrap">
  <div class="kids" id="kids"></div>
  <section class="jar" id="jar" aria-live="polite"></section>
  <nav class="days" id="days" aria-label="Day of the week"></nav>
  <div class="viewbar"><div class="seg" role="group" aria-label="Job layout"><button type="button" data-act="view" data-v="list">☰ List</button><button type="button" data-act="view" data-v="tiles">▦ 2 per row</button></div><button type="button" class="tvbtn" data-act="tv">📺 TV scoreboard</button></div>
  <main id="main"></main>
  <button class="sync" id="sync" type="button"></button>
</div>
<section class="tv" id="tv" aria-live="polite"></section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- data ---------- */
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var KIDS={matilda:{name:'Matilda',init:'M'},brooks:{name:'Brooks',init:'B'}};
var JOBS=[
 {id:'clock',g:'morning',e:'🟢',t:'Stay in your room until your clock is green',v:1},
 {id:'dress',g:'morning',e:'👕',t:'Get dressed',v:1},
 {id:'hair',g:'morning',e:'💇',t:'Brush your hair',v:1},
 {id:'teethAm',g:'morning',e:'🪥',t:'Brush your teeth',s:'Morning',v:1},
 {id:'bed',g:'morning',e:'🛏️',t:'Make your bed',v:1},
 {id:'backpack',g:'morning',e:'🎒',t:'Pack your backpack',v:1},
 {id:'unpack',g:'day',e:'📚',t:'Unpack your backpack',v:1},
 {id:'fight',g:'day',e:'🤝',t:'No fighting with each other',v:1},
 {id:'dishes',g:'day',e:'🍽️',t:'Bring your dishes to the sink',s:'1 token every time you bring dishes',v:1,count:true},
 {id:'laundry',g:'day',e:'🧺',t:'Clothes in the laundry basket',v:1},
 {id:'jacket',g:'day',e:'🧥',t:'Hang up your jacket',v:1},
 {id:'cleanup',g:'day',e:'🧸',t:'Clean up after each activity',s:'1 token for every activity you clean up',v:1,count:true},
 {id:'flush',g:'day',e:'🚽',t:'Flush the toilet',s:'1 token every time you flush',v:1,count:true},
 {id:'hockey',g:'day',e:'🏒',t:'Get ready for hockey',s:'Water bottle, equipment in the bag, stick',v:1,only:'matilda',days:[5,6]},
 {id:'break',g:'day',e:'🛝',t:'Have a good second break',s:'At school',v:3,only:'brooks',days:[0,1,2,3,4]},
 {id:'teethPm',g:'night',e:'🪥',t:'Brush your teeth',s:'Night',v:1},
 {id:'sleep',g:'night',e:'🌙',t:'Go to bed nicely',v:1},
 {id:'bins',g:'bonus',e:'🗑️',t:'Garbage bins to the curb and back up',v:2},
 {id:'vacuum',g:'bonus',e:'🧹',t:'Vacuum',v:2},
 {id:'food',g:'bonus',e:'🥦',t:'Try a new food',v:2},
 {id:'school',g:'bonus',e:'🏫',t:'No call from the principal and no school incidents',s:'Friday bonus',v:5,only:'brooks',days:[4]},
 {id:'help',g:'bonus',e:'💛',t:'Help someone else out',s:'2 tokens every time you help',v:2,count:true}
];
var GROUPS=[['morning','Morning'],['day','During the day'],['night','Bedtime'],['bonus','Bonus jobs']];
var TREAT=5, HOUR=10;

/* ---------- time ---------- */
function pad(n){return (n<10?'0':'')+n}
var now=new Date();
var todayIdx=(now.getDay()+6)%7;
var ws=new Date(now.getFullYear(),now.getMonth(),now.getDate()-todayIdx);
var weekKey=ws.getFullYear()+'-'+pad(ws.getMonth()+1)+'-'+pad(ws.getDate());

/* ---------- state ---------- */
var kid='matilda', day=todayIdx;
var state={matilda:{days:{}},brooks:{days:{}}};
try{var lk=localStorage.getItem('tt-kid'); if(lk&&KIDS[lk]) kid=lk;}catch(e){}
['matilda','brooks'].forEach(function(k){
  try{var raw=localStorage.getItem('tt-'+k+'-'+weekKey); if(raw){var v=JSON.parse(raw); if(v&&v.days) state[k]=v;}}catch(e){}
});
function fix(d){
  if(!d.jobs) d.jobs={}; if(!d.treat) d.treat=false; d.hours=+d.hours||0; d.extra=+d.extra||0;
  // Jobs that became counters (dishes, Nov 2026) may still hold an old checkmark: true -> 1, false -> 0.
  JOBS.forEach(function(j){ if(j.count&&typeof d.jobs[j.id]==='boolean') d.jobs[j.id]=d.jobs[j.id]?1:0; });
  return d;
}
function dd(k,i){var D=state[k].days; if(!D[i]) D[i]={}; return fix(D[i]);}
function peek(k,i){return fix(state[k].days[i]||{});}
function applies(j,k,i){return !j.only||(j.only===k&&j.days.indexOf(i)>-1);}
function val(j,d){var x=d.jobs[j.id]; if(j.count) return (+x||0)*j.v; return x?j.v:0;}
function earnedDay(k,i){var d=peek(k,i),t=d.extra; JOBS.forEach(function(j){if(applies(j,k,i)) t+=val(j,d);}); return t;}
function spentDay(k,i){var d=peek(k,i); return (d.treat?TREAT:0)+d.hours*HOUR;}
function totals(k){var e=0,s=0; for(var i=0;i<7;i++){e+=earnedDay(k,i); s+=spentDay(k,i);} return {e:e,s:s,left:e-s};}

/* ---------- saving: Firebase Firestore keeps every phone and iPad in step ----------
   Data lives at families/<family code>/weeks/<kid>-<week start>. The family code is a long
   random secret that is never in this file: each device gets it once from the family link
   (…/#family=CODE) or by tapping the sync label and pasting it. */
// Firebase web config. Public by design: access is controlled by firestore.rules and the family code.
var FIREBASE={
  apiKey:"AIzaSyBvdPNPlLAt8iRVDPizGU9DiKOilWWO5Cg",
  authDomain:"token-time-f2bfe.firebaseapp.com",
  projectId:"token-time-f2bfe",
  storageBucket:"token-time-f2bfe.firebasestorage.app",
  messagingSenderId:"524550131061",
  appId:"1:524550131061:web:775cd5dfd9402b9211573c"
};
var SDK='https://www.gstatic.com/firebasejs/10.14.1/';
var FAMILY=null;
function readFamily(s){var m=/(?:family=)?([A-Za-z0-9_-]{20,})\s*$/.exec(s||''); return m?m[1]:null;}
(function(){
  var h=/[#&]family=([A-Za-z0-9_-]{20,})/.exec(location.hash);
  try{ if(h) localStorage.setItem('tt-family',h[1]); FAMILY=h?h[1]:localStorage.getItem('tt-family'); }catch(e){ FAMILY=h?h[1]:null; }
})();
var F=null, refs={}, synced={matilda:null,brooks:null};
function clone(o){return JSON.parse(JSON.stringify(o));}
function leaves(o,pre,out){
  Object.keys(o||{}).forEach(function(key){var v=o[key], p=pre.concat(key);
    if(v&&typeof v==='object') leaves(v,p,out); else out[p.join('\u0001')]=v;});
  return out;
}
function setSync(s){
  var el=document.getElementById('sync'); if(!el) return;
  el.className='sync '+s;
  el.textContent={on:'Live on all devices',off:'Offline, will sync when back online',none:'Only on this device · tap to link',wait:'Connecting…'}[s];
  if(typeof renderTV==='function') renderTV();
}
function save(k){
  try{localStorage.setItem('tt-'+k+'-'+weekKey,JSON.stringify(state[k]));}catch(e){}
  if(!F||!synced[k]) return;
  // Send only the fields that changed, so two people tapping different jobs never overwrite each other.
  var now=leaves(state[k],[],{}), was=leaves(synced[k],[],{}), args=[];
  Object.keys(now).forEach(function(p){ if(was[p]!==now[p]) args.push(new F.FieldPath(...p.split('\u0001')), now[p]); });
  Object.keys(was).forEach(function(p){ if(!(p in now)) args.push(new F.FieldPath(...p.split('\u0001')), F.deleteField()); });
  synced[k]=clone(state[k]);
  if(!args.length) return;
  var ref=refs[k], full=clone(state[k]);
  F.updateDoc.apply(null,[ref].concat(args)).catch(function(){ F.setDoc(ref,full,{merge:true}).catch(function(){}); });
}
function connect(){
  if(!FIREBASE){ document.getElementById('sync').hidden=true; return; }
  if(!FAMILY){ setSync('none'); return; }
  setSync('wait');
  Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-firestore.js')]).then(function(m){
    var A=m[0], S=m[1], app=A.initializeApp(FIREBASE), db;
    try{ db=S.initializeFirestore(app,{localCache:S.persistentLocalCache({tabManager:S.persistentMultipleTabManager()})}); }
    catch(e){ db=S.getFirestore(app); }
    F=S;
    ['matilda','brooks'].forEach(function(k){
      refs[k]=S.doc(db,'families',FAMILY,'weeks',k+'-'+weekKey);
      S.onSnapshot(refs[k],{includeMetadataChanges:true},function(snap){
        setSync(snap.metadata.fromCache?'off':'on');
        if(!snap.exists()){
          if(snap.metadata.fromCache) return; // wait for the server before treating the week as new
          synced[k]=clone(state[k]);
          S.setDoc(refs[k],clone(state[k]),{merge:true}).catch(function(){});
          return;
        }
        var v=snap.data();
        state[k]={days:v.days&&typeof v.days==='object'?v.days:{}};
        synced[k]=clone(state[k]);
        try{localStorage.setItem('tt-'+k+'-'+weekKey,JSON.stringify(state[k]));}catch(e){}
        render();
      },function(){ setSync('off'); });
    });
  }).catch(function(){ setSync('off'); });
}
document.addEventListener('click',function(ev){
  if(!ev.target.closest('#sync')||!FIREBASE) return;
  var code=readFamily(prompt('Paste the family link or code to share tokens across devices:'));
  if(!code) return;
  try{localStorage.setItem('tt-family',code);}catch(e){}
  location.hash='family='+code; location.reload();
});
// Opening the family link in a tab that already has the app open: reload to join.
window.addEventListener('hashchange',function(){
  var h=/[#&]family=([A-Za-z0-9_-]{20,})/.exec(location.hash);
  if(h&&h[1]!==FAMILY){ try{localStorage.setItem('tt-family',h[1]);}catch(e){} location.reload(); }
});
// Pick up a new day or week when the app comes back from the background.
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible') return;
  var n=new Date(); if(n.toDateString()!==now.toDateString()) location.reload();
});

/* ---------- feedback ---------- */
var toastTimer;
function toast(msg){var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2200);}
function pop(el,text){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var r=el.getBoundingClientRect(), p=document.createElement('div');
  p.className='pop'; p.textContent=text; p.style.left=(r.left+r.width/2-20)+'px'; p.style.top=(r.top)+'px';
  document.body.appendChild(p); setTimeout(function(){p.remove();},850);
}

/* ---------- render ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(){
  document.body.setAttribute('data-kid',kid);
  document.getElementById('kids').innerHTML=Object.keys(KIDS).map(function(k){
    return '<button class="kid" data-k="'+k+'" data-act="kid" aria-pressed="'+(k===kid)+'"><span class="av">'+KIDS[k].init+'</span>'+KIDS[k].name+'</button>';
  }).join('');

  var T=totals(kid), left=Math.max(T.left,0);
  var coins=''; for(var c=0;c<Math.min(left,40);c++) coins+='<span class="mini"></span>';
  var target=left<TREAT?TREAT:(left<HOUR?HOUR:0);
  var goal='';
  if(target){goal='<div class="goal"><span>'+(target-left)+' more '+(target-left===1?'token':'tokens')+' for '+(target===TREAT?'a treat':'1 hour of iPad or YouTube')+'</span><div class="bar"><i style="width:'+Math.round(left/target*100)+'%"></i></div></div>';}
  else goal='<div class="goal"><span>You have enough for a treat and an iPad hour!</span></div>';
  document.getElementById('jar').innerHTML=
    '<div class="jar-top"><div class="bigcoin">'+left+'</div><div><h1>'+KIDS[kid].name+', you have '+left+' '+(left===1?'token':'tokens')+'</h1><p>Earned '+T.e+' this week · Spent '+T.s+'</p></div></div>'+
    '<div class="stack">'+coins+'</div>'+goal;

  document.getElementById('days').innerHTML=DAYS.map(function(n,i){
    return '<button class="day'+(i===todayIdx?' today':'')+'" data-act="day" data-i="'+i+'" aria-pressed="'+(i===day)+'" aria-label="'+n+(i===todayIdx?' (today)':'')+'">'+n+'<small>+'+earnedDay(kid,i)+'</small></button>';
  }).join('');

  var d=dd(kid,day), html='';
  GROUPS.forEach(function(g){
    var list=JOBS.filter(function(j){return j.g===g[0]&&applies(j,kid,day);});
    if(!list.length) return;
    html+='<div class="group"><h2>'+g[1]+'</h2>';
    list.forEach(function(j){
      var pic='<span class="pic">'+j.e+'</span>';
      var txt='<span class="txt">'+esc(j.t)+(j.s?'<small>'+esc(j.s)+'</small>':'')+'</span>';
      var badge='<span class="badge">+'+j.v+'</span>';
      if(j.count){
        var n=d.jobs[j.id]||0;
        html+='<div class="card counter'+(n?' done':'')+'">'+pic+txt+badge+'<span class="step"><button data-act="step" data-id="'+j.id+'" data-d="-1" aria-label="One less"'+(n?'':' disabled')+'>−</button><output>'+n+'</output><button data-act="step" data-id="'+j.id+'" data-d="1" aria-label="One more">+</button></span></div>';
      }else{
        var on=!!d.jobs[j.id];
        html+='<button class="card'+(on?' done':'')+'" data-act="job" data-id="'+j.id+'" aria-pressed="'+on+'">'+pic+txt+badge+'<span class="tick">'+(on?'✓':'')+'</span></button>';
      }
    });
    html+='</div>';
  });

  html+='<div class="group"><h2>From Mom and Dad</h2><div class="card counter wide'+(d.extra?' done':'')+'"><span class="pic">💝</span><span class="txt">Extra tokens, just because<small>For Mom and Dad to give</small></span><span class="badge">+'+d.extra+'</span><span class="step"><button data-act="extra" data-d="-1" aria-label="Take back one token"'+(d.extra?'':' disabled')+'>−</button><button data-act="extra" data-d="1" aria-label="Give one token">+</button><button data-act="extra" data-d="5" aria-label="Give five tokens" style="width:auto;padding:0 12px;border-radius:22px;font-size:20px">+5</button></span></div></div>';
  var weekend=day>=5;
  html+='<div class="group"><h2>Spend your tokens</h2><div class="shop">'+
    '<button class="card'+(d.treat?' done':'')+'" data-act="treat" aria-pressed="'+d.treat+'"><span class="pic">🍪</span><span class="txt">One treat<small>'+(d.treat?'Enjoy your treat!':'1 treat a day')+'</small></span><span class="badge">'+TREAT+'</span><span class="tick">'+(d.treat?'✓':'')+'</span></button>'+
    '<div class="card counter'+(weekend?'':' locked')+(d.hours?' done':'')+'"><span class="pic">📱</span><span class="txt">1 hour of iPad or YouTube<small>'+(weekend?'Saturday and Sunday only':'Only on Saturday and Sunday')+'</small></span><span class="badge">'+HOUR+'</span><span class="step"><button data-act="hours" data-d="-1" aria-label="One less hour"'+(d.hours?'':' disabled')+'>−</button><output>'+(d.hours||0)+'</output><button data-act="hours" data-d="1" aria-label="One more hour"'+(weekend?'':' disabled')+'>+</button></span></div>'+
    '</div></div>';
  document.getElementById('main').innerHTML=html;
  renderTV();
}

/* ---------- TV scoreboard ---------- */
var tvOn=false, tvLast={}, tvBump={}, tvHTML='', wakeLock=null;
var FULLDAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function goalHTML(icon,need,left,doneText,readyText,waitText){
  if(doneText) return '<div class="tv-goal ready"><span>'+icon+' '+doneText+'</span></div>';
  var pct=Math.min(100,Math.round(left/need*100));
  if(left>=need) return '<div class="tv-goal ready"><span>'+icon+' '+readyText+'</span><div class="tv-bar"><i style="width:100%"></i></div></div>';
  var more=need-left;
  return '<div class="tv-goal"><span>'+icon+' '+more+' more '+(more===1?'token':'tokens')+' '+waitText+'</span><div class="tv-bar"><i style="width:'+pct+'%"></i></div></div>';
}
function renderTV(){
  if(!tvOn) return;
  var el=document.getElementById('tv'), sync=document.getElementById('sync');
  var weekend=todayIdx>=5, html='';
  html+='<header class="tv-head"><div class="tv-day">'+FULLDAYS[todayIdx]+', '+MONTHS[now.getMonth()]+' '+now.getDate()+'</div>'+
    (sync&&!sync.hidden?'<span class="'+sync.className+'">'+esc(sync.textContent)+'</span>':'')+
    '<button class="tv-exit" data-act="tv" aria-label="Leave TV scoreboard">✕</button></header><div class="tv-kids">';
  Object.keys(KIDS).forEach(function(k){
    var T=totals(k), left=Math.max(T.left,0), d=peek(k,todayIdx), today=earnedDay(k,todayIdx);
    if(tvLast[k]!=null&&left>tvLast[k]) tvBump[k]=Date.now()+900;
    tvLast[k]=left;
    var bump=Date.now()<(tvBump[k]||0);
    var jobs=JOBS.filter(function(j){return applies(j,k,todayIdx);}), doneCount=0;
    var chips=jobs.map(function(j){
      var n=j.count?(+d.jobs[j.id]||0):(d.jobs[j.id]?1:0); if(n) doneCount++;
      return '<span class="chip'+(n?' on':'')+'" role="img" aria-label="'+esc(j.t)+(n?' done':' not done yet')+'">'+j.e+(j.count&&n>1?'<b>×'+n+'</b>':'')+'</span>';
    }).join('');
    html+='<section class="tv-kid '+k+'">'+
      '<div class="tv-name"><span class="tv-av">'+KIDS[k].init+'</span>'+KIDS[k].name+'</div>'+
      '<div class="tv-coinrow"><div class="tv-coin'+(bump?' bump':'')+'">'+left+'</div>'+
        '<div class="tv-left">'+(left===1?'token':'tokens')+' to spend<small>Today +'+today+' · This week earned '+T.e+', spent '+T.s+'</small></div></div>'+
      goalHTML('🍪',TREAT,left,d.treat?'Treat enjoyed today':'','Treat ready!','for a treat')+
      goalHTML('📱',HOUR,left,'',weekend?'iPad hour ready!':'iPad hour saved for the weekend!',weekend?'for an iPad hour':'for a weekend iPad hour')+
      '<div class="tv-sub">Jobs today: '+doneCount+' of '+jobs.length+'</div>'+
      '<div class="tv-chips" style="grid-template-columns:repeat('+Math.max(9,Math.ceil(jobs.length/2))+',1fr)">'+chips+'</div>'+
    '</section>';
  });
  html+='</div>';
  if(html!==tvHTML){ tvHTML=html; el.innerHTML=html; }
}
function keepAwake(on){
  // The iPad must stay awake or AirPlay mirroring stops.
  if(on&&navigator.wakeLock&&document.visibilityState==='visible'){
    navigator.wakeLock.request('screen').then(function(l){wakeLock=l;}).catch(function(){});
  }else if(!on&&wakeLock){ wakeLock.release().catch(function(){}); wakeLock=null; }
}
function setTV(on){
  tvOn=on; tvLast={}; tvBump={}; tvHTML='';
  try{ if(on) localStorage.setItem('tt-tv','1'); else localStorage.removeItem('tt-tv'); }catch(e){}
  document.body.classList.toggle('tvmode',on);
  keepAwake(on);
  if(on) renderTV(); else window.scrollTo(0,0);
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&tvOn) setTV(false); });
document.addEventListener('visibilitychange',function(){ if(tvOn&&document.visibilityState==='visible') keepAwake(true); });

/* ---------- actions ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b) return;
  var act=b.getAttribute('data-act'), d, T;
  if(act==='kid'){kid=b.getAttribute('data-k'); try{localStorage.setItem('tt-kid',kid);}catch(e){} render(); return;}
  if(act==='day'){day=+b.getAttribute('data-i'); render(); return;}
  if(act==='tv'){setTV(!tvOn); return;}
  if(act==='view'){view=b.getAttribute('data-v'); try{localStorage.setItem('tt-view',view);}catch(e){} applyView(); return;}
  d=dd(kid,day);
  var el=b, plus=null;
  if(act==='job'){
    var j=JOBS.filter(function(x){return x.id===b.getAttribute('data-id');})[0];
    var was=!!d.jobs[j.id]; d.jobs[j.id]=!was;
    if(was&&totals(kid).left<0){d.jobs[j.id]=true; toast('Those tokens are already spent'); return;}
    if(!was) plus='+'+j.v;
  }else if(act==='step'){
    var j2=JOBS.filter(function(x){return x.id===b.getAttribute('data-id');})[0], dl=+b.getAttribute('data-d');
    var n=(d.jobs[j2.id]||0)+dl; if(n<0) return;
    d.jobs[j2.id]=n;
    if(dl<0&&totals(kid).left<0){d.jobs[j2.id]=n+1; toast('Those tokens are already spent'); return;}
    if(dl>0) plus='+'+j2.v;
  }else if(act==='extra'){
    var de=+b.getAttribute('data-d'), ne=d.extra+de;
    if(ne<0) return;
    d.extra=ne;
    if(de<0&&totals(kid).left<0){d.extra=ne-de; toast('Those tokens are already spent'); return;}
    if(de>0) plus='+'+de;
  }else if(act==='treat'){
    if(d.treat){d.treat=false;}
    else{ if(totals(kid).left<TREAT){toast('You need '+TREAT+' tokens for a treat'); return;} d.treat=true; plus='🍪'; }
  }else if(act==='hours'){
    var dh=+b.getAttribute('data-d'), h=(d.hours||0)+dh;
    if(h<0) return;
    if(dh>0){ if(day<5){toast('iPad time is for the weekend'); return;} if(totals(kid).left<HOUR){toast('You need '+HOUR+' tokens for an hour'); return;} plus='📱'; }
    d.hours=h;
  }
  save(kid); render();
  if(plus){var live=document.querySelector('[data-act="'+act+'"]'+(b.getAttribute('data-id')?'[data-id="'+b.getAttribute('data-id')+'"]':'')); pop(live||document.getElementById('jar'),plus);}
});

// Layout choice is per device (a phone may want tiles, the iPad a list).
var view='list';
try{ if(localStorage.getItem('tt-view')==='tiles') view='tiles'; }catch(e){}
function applyView(){
  document.body.classList.toggle('tiles',view==='tiles');
  document.querySelectorAll('[data-act=view]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===view));});
}
applyView();
render();
try{ if(localStorage.getItem('tt-tv')==='1') setTV(true); }catch(e){}
connect();
// A scoreboard left on all night never goes to the background, so also check the date every minute.
setInterval(function(){ if(new Date().toDateString()!==now.toDateString()) location.reload(); },60000);
</script>
